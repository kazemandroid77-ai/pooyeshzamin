name: Build PooyeshZamin 1.0.50 installers (new signing identity)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pooyeshzamin-installers-1.0.50
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-pooyesh-android-${{runner.os}}-${{hashFiles('source/scripts/release/build-android.sh')}}
          restore-keys: |
            linux-npm-pooyesh-android-${{runner.os}}-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "Android sdkmanager not found under $SDK_ROOT" >&2; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android build utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip

      - name: Restore new release signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{secrets.APK_KEYSTORE_BASE64}}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing repository secret APK_KEYSTORE_BASE64" >&2; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"
          test -s "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"

      - name: Build Android APKs with the new signing identity
        shell: bash
        env:
          PZ_STORE_PASSWORD: ${{secrets.APK_KEYSTORE_PASSWORD}}
          PZ_KEY_ALIAS: ${{secrets.APK_KEY_ALIAS}}
          PZ_KEY_PASSWORD: ${{secrets.APK_KEY_PASSWORD}}
        run: |
          set -euo pipefail
          test -n "$PZ_STORE_PASSWORD" || { echo "Missing repository secret APK_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$PZ_KEY_ALIAS" || { echo "Missing repository secret APK_KEY_ALIAS" >&2; exit 1; }
          test -n "$PZ_KEY_PASSWORD" || { echo "Missing repository secret APK_KEY_PASSWORD" >&2; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/scripts/release/build-android.sh")
          s = p.read_text()
          new = "EFE4FB2E09A47DD3D08BEBE2F3CA2C261A0D941A241BCD1249B9AB3EAFE4308C"
          replacement = "86F196E7E3445F064E71A58E3C9260053C1415A4A31B3EFF38448E385E2B5FFE"
          if s.count(new) != 1:
              raise SystemExit("Expected exactly one current signing pin; refusing an unsafe patch.")
          p.write_text(s.replace(new, replacement))
          PY
          bash source/scripts/release/build-android.sh "$GITHUB_WORKSPACE/source" "1.0.50" "$GITHUB_WORKSPACE/android-output" "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: android-output/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktop = Join-Path $PWD 'source/desktop'
          Push-Location $desktop
          try {
            npm version 1.0.50 --no-git-tag-version
            if ($LASTEXITCODE -ne 0) { throw 'npm version failed' }
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run build:icon
            if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
            npm run dist:win
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          }
          finally {
            Pop-Location
          }
          $out = Join-Path $PWD 'windows-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem (Join-Path $desktop 'dist') -File | Copy-Item -Destination $out -Force
          $installer = Join-Path $out 'PooyeshZamin-Admin-Setup-1.0.50.exe'
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -le 0) {
            throw 'Expected PooyeshZamin-Admin-Setup-1.0.50.exe was not produced.'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows-output/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-installers
          path: bundle

      - name: Download Windows installer and updater metadata
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: bundle

      - name: Validate and checksum all four installers
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          for f in pooyesh-admin-1.0.50.apk pooyesh-patrol-1.0.50.apk pooyesh-subscriber-1.0.50.apk PooyeshZamin-Admin-Setup-1.0.50.exe; do
            test -s "$f" || { echo "Missing or empty installer: $f" >&2; exit 1; }
          done
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test -s latest.yml
          compgen -G '*.blockmap' >/dev/null
          sha256sum *.apk *.exe latest.yml *.blockmap > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'EOF'
          ## پویش زمین 1.0.50

          - اپلیکیشن مدیریت اندروید
          - اپلیکیشن گشت اندروید با سرویس GPS پس‌زمینه
          - اپلیکیشن مشترکین اندروید
          - نصب‌کننده دسکتاپ ویندوز x64

          APKها با هویت امضای جدید ساخته شده‌اند. برای نصب روی دستگاهی که نسخه‌ای با امضای قبلی دارد، ابتدا نسخه قبلی را حذف و سپس این نسخه را نصب کنید. داده‌های همگام‌نشده محلی ممکن است از دست بروند.
          برای بررسی صحت فایل‌ها از SHA256SUMS.txt استفاده کنید.
          EOF

      - name: Upload final four-installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: PooyeshZamin-1.0.50-Installers
          path: bundle/*
          if-no-files-found: error
          retention-days: 14
