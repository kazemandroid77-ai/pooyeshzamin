name: Production internal-admin security smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-internal-admin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify production Worker health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://pooyeshzamin-api.pooyesh-zamin.workers.dev/health)"
          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "Production Worker health endpoint is healthy."

      - name: Verify failed codes are counted and throttled from one persistent client
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = "https://pooyeshzamin-api.pooyesh-zamin.workers.dev/api/admin/request";
          const body = {
            name: "Smoke Test Invalid Request",
            phone: "09123456780",
            code: "deliberately-wrong-smoke-test-code",
            pub: { kty: "EC", crv: "P-256", x: "invalid", y: "invalid" }
          };

          for (let attempt = 1; attempt <= 6; attempt++) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const payload = await response.json();
            const expected = attempt <= 5 ? 403 : 429;
            if (response.status !== expected) {
              throw new Error(`Attempt ${attempt}: expected HTTP ${expected}, received ${response.status}: ${JSON.stringify(payload)}`);
            }
            if (attempt === 6 && !String(payload.error || "").includes("تعداد تلاش‌ها بیش از حد مجاز")) {
              throw new Error("The sixth attempt was not rejected by the expected rate limiter.");
            }
            console.log(`Attempt ${attempt}: HTTP ${response.status}`);
          }
          console.log("Production Worker throttled the sixth invalid-code attempt.");
          NODE
