name: Production internal-admin security smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-internal-admin-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify production Worker health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://pooyeshzamin-api.pooyesh-zamin.workers.dev/health)"
          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "Production Worker health endpoint is healthy."

      - name: Verify failed codes are counted and throttled
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://pooyeshzamin-api.pooyesh-zamin.workers.dev/api/admin/request"
          body='{"name":"Smoke Test Invalid Request","phone":"09123456780","code":"deliberately-wrong-smoke-test-code","pub":{"kty":"EC","crv":"P-256","x":"invalid","y":"invalid"}}'
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --max-time 30 -o /tmp/pz-smoke-response.json -w '%{http_code}' \
              -H 'Content-Type: application/json' -X POST "$endpoint" --data "$body")"
            if [[ "$status" != "403" ]]; then
              echo "Expected HTTP 403 for invalid code attempt $attempt, got $status." >&2
              cat /tmp/pz-smoke-response.json >&2
              exit 1
            fi
          done

          status="$(curl --silent --show-error --max-time 30 -o /tmp/pz-smoke-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -X POST "$endpoint" --data "$body")"
          if [[ "$status" != "429" ]]; then
            echo "Expected HTTP 429 on the sixth attempt, got $status." >&2
            cat /tmp/pz-smoke-response.json >&2
            exit 1
          fi
          jq -e '.error | strings | test("تعداد تلاش‌ها بیش از حد مجاز")' /tmp/pz-smoke-response.json >/dev/null
          echo "Production Worker throttled the sixth invalid-code attempt (5 attempts / 15 minutes)."
