name: Publish Pooyesh Zamin installers

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful installer build workflow run ID"
        required: true
        type: string
  workflow_run:
    workflows:
      - "Build PooyeshZamin installers"
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-pooyeshzamin-installers
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'build/')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve source run and locate its installer bundle
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$INPUT_RUN_ID"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Invalid source workflow run ID." >&2; exit 1; }

          run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
          run_repository="$(jq -r '.repository.full_name' <<< "$run_json")"
          run_status="$(jq -r '.status' <<< "$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          run_sha="$(jq -r '.head_sha' <<< "$run_json")"
          run_branch="$(jq -r '.head_branch' <<< "$run_json")"

          [[ "$run_repository" == "$REPOSITORY" ]] || { echo "Source run belongs to another repository." >&2; exit 1; }
          [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]] || {
            echo "Source build must be completed successfully." >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$run_branch" != build/* ]]; then
            echo "Manual publication accepts only build/* workflow branches." >&2
            exit 1
          fi

          artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_name="$(jq -r '
            [.artifacts[]
              | select(.expired == false)
              | select(.name | startswith("PooyeshZamin-"))
              | select(.name | endswith("-Installers"))]
            | sort_by(.created_at)
            | last // {}
            | .name // ""
          ' <<< "$artifacts_json")"

          if [[ -z "$artifact_name" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "No unexpired PooyeshZamin installer bundle was found in run $run_id." >&2
              exit 1
            fi
            echo "No installer bundle in this successful build run; nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "head_sha=$run_sha" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Selected $artifact_name from successful run $run_id ($run_sha)"

      - name: Download the installer bundle
        if: steps.source.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the complete installer bundle and checksums
        if: steps.source.outputs.found == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          mapfile -t exes < <(find . -maxdepth 1 -type f -name 'PooyeshZamin-Admin-Setup-*.exe' -printf '%f\n')
          [[ "${#exes[@]}" -eq 1 ]] || { echo "Expected exactly one Windows installer." >&2; exit 1; }
          version="${exes[0]#PooyeshZamin-Admin-Setup-}"
          version="${version%.exe}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $version" >&2; exit 1; }

          for file in \
            "pooyesh-admin-$version.apk" \
            "pooyesh-patrol-$version.apk" \
            "pooyesh-subscriber-$version.apk" \
            "PooyeshZamin-Admin-Setup-$version.exe" \
            "PooyeshZamin-Admin-Setup-$version.exe.blockmap" \
            latest.yml SHA256SUMS.txt RELEASE_NOTES.md; do
            test -s "$file" || { echo "Missing or empty release file: $file" >&2; exit 1; }
          done

          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.blockmap' | wc -l)" -eq 1

          grep -Eq "^version: *['\"]?$version([ '\"]|$)" latest.yml || {
            echo "latest.yml version does not match installer version $version." >&2
            exit 1
          }
          grep -Fq "PooyeshZamin-Admin-Setup-$version.exe" latest.yml || {
            echo "latest.yml does not reference the matching Windows installer." >&2
            exit 1
          }

          # The checksum manifest must cover every distributable asset exactly once.
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' ! -name 'RELEASE_NOTES.md' \
            -printf '%f\n' | sort > /tmp/actual-assets.txt
          awk '{name=$2; sub(/^\*/, "", name); print name}' SHA256SUMS.txt | sort > /tmp/checksummed-assets.txt
          diff -u /tmp/actual-assets.txt /tmp/checksummed-assets.txt
          sha256sum --check SHA256SUMS.txt

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Validated all assets and SHA-256 checksums for v$version"

      - name: Read destination releases and enforce increasing version
        if: steps.source.outputs.found == 'true'
        id: destination
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
          DESTINATION_REPOSITORY: ModernOutlook/-
          NEW_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || {
            echo "Missing DISTRIBUTION_TOKEN secret with access to ModernOutlook/-." >&2
            exit 1
          }

          releases_json="$(gh api --paginate --slurp "repos/$DESTINATION_REPOSITORY/releases?per_page=100" | jq 'add | map(select(.draft == false and .prerelease == false) | {tagName: .tag_name, assets: [.assets[].name]})')"
          printf '%s\n' "$releases_json" > /tmp/destination-releases.json

          latest_version="$(jq -r '
            [.[] | .tagName
              | select(test("^v[0-9]+\.[0-9]+\.[0-9]+$"))
              | ltrimstr("v")]
            | sort_by(split(".") | map(tonumber))
            | last // ""
          ' <<< "$releases_json")"

          echo "Published destination releases and their asset names:"
          jq -r '.[] | "\(.tagName): \(.assets | join(", "))"' <<< "$releases_json"
          if [[ -n "$latest_version" ]]; then
            echo "Latest published version: $latest_version"
            max_version="$(printf '%s\n%s\n' "$latest_version" "$NEW_VERSION" | sort -V | tail -n 1)"
            if [[ "$max_version" != "$NEW_VERSION" || "$latest_version" == "$NEW_VERSION" ]]; then
              echo "New version $NEW_VERSION must be greater than destination version $latest_version." >&2
              exit 1
            fi
          else
            echo "No stable semantic-version release exists yet; accepting first release."
          fi

          echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Publish the new version as the latest destination release
        if: steps.source.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ModernOutlook/-
          token: ${{ secrets.DISTRIBUTION_TOKEN }}
          tag_name: v${{ steps.meta.outputs.version }}
          name: Pooyesh Zamin v${{ steps.meta.outputs.version }}
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/*.apk
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/latest.yml
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
