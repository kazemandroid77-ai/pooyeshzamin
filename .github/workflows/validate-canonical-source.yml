name: Validate canonical Android OTA source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-canonical-source.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or exact commit in ModernOutlook/pooyeshzamin"
        required: true
        default: "feat/android-web-ota-standalone-apks"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build repository
        uses: actions/checkout@v4

      - name: Check source repository access
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SOURCE_REPO_TOKEN" ]]; then
            echo "Missing SOURCE_REPO_TOKEN secret in the build repository. Add a fine-grained token with Contents: Read access to ModernOutlook/pooyeshzamin." >&2
            exit 1
          fi

      - name: Check out canonical application source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ inputs.source_ref || 'feat/android-web-ota-standalone-apks' }}
          path: source
          fetch-depth: 0

      - name: Record canonical source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "sourceRepository=ModernOutlook/pooyeshzamin"
            echo "sourceRef=${{ inputs.source_ref || 'feat/android-web-ota-standalone-apks' }}"
            echo "sourceCommit=$SOURCE_SHA"
          } | tee source-revision.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate canonical version mapping
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 scripts/release/version-code.py 1.7.0)" = "1007000"
          test "$(python3 scripts/release/version-code.py 1.0.60)" = "1000060"
          if python3 scripts/release/version-code.py 1.7 >/dev/null 2>&1; then
            echo "Invalid semantic version was accepted" >&2
            exit 1
          fi

      - name: Validate panel and OTA JavaScript
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-apps.mjs 2>&1 | tee ../validation.log

      - name: Validate Android release shell syntax
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          bash -n scripts/release/build-android.sh 2>&1 | tee -a ../validation.log

      - name: Validate OTA Worker syntax
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --check cloudflare/worker.js 2>&1 | tee -a ../validation.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-validation-${{ steps.source.outputs.sha || 'unknown' }}
          path: |
            validation.log
            source-revision.txt
          if-no-files-found: warn
