name: Validate canonical Android OTA source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-canonical-source.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or exact commit in ModernOutlook/pooyeshzamin"
        required: true
        default: "feat/android-web-ota-standalone-apks"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build repository
        uses: actions/checkout@v4

      - name: Check source repository access
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SOURCE_REPO_TOKEN" ]]; then
            echo "Missing SOURCE_REPO_TOKEN secret in the build repository. Add a fine-grained token with Contents: Read access to ModernOutlook/pooyeshzamin." >&2
            exit 1
          fi

      - name: Check out canonical application source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ inputs.source_ref || 'feat/android-web-ota-standalone-apks' }}
          path: source
          fetch-depth: 0

      - name: Record canonical source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "sourceRepository=ModernOutlook/pooyeshzamin"
            echo "sourceRef=${{ inputs.source_ref || 'feat/android-web-ota-standalone-apks' }}"
            echo "sourceCommit=$SOURCE_SHA"
          } | tee source-revision.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate canonical version mapping
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 scripts/release/version-code.py 1.7.0)" = "1007000"
          test "$(python3 scripts/release/version-code.py 1.0.60)" = "1000060"
          if python3 scripts/release/version-code.py 1.7 >/dev/null 2>&1; then
            echo "Invalid semantic version was accepted" >&2
            exit 1
          fi

      - name: Validate panel and OTA JavaScript
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-apps.mjs 2>&1 | tee ../validation.log

      - name: Validate Android release shell syntax
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          bash -n scripts/release/build-android.sh 2>&1 | tee -a ../validation.log

      - name: Validate OTA Worker syntax
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          node --check cloudflare/worker.js 2>&1 | tee -a ../validation.log

      - name: Verify live OTA signatures against the APK-pinned public key
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module 2>&1 <<'NODE' | tee -a ../live-ota-validation.log
          import { readFileSync } from "node:fs";
          import { webcrypto } from "node:crypto";

          const source = readFileSync("apps/shared/android-ota.js", "utf8");
          const keyStart = source.indexOf("const PUBLIC_KEY = ");
          const keyEnd = source.indexOf("};", keyStart);
          if (keyStart < 0 || keyEnd < 0) throw new Error("APK-pinned OTA public key block was not found");
          const keyBlock = source.slice(keyStart, keyEnd);
          const fields = keyBlock.slice(keyBlock.indexOf("{") + 1).split(",");
          const value = name => fields.find(field => field.trim().startsWith(name + ":"))
            ?.split(":").slice(1).join(":").trim().replace(/^"|"$/g, "");
          const publicJwk = {
            kty: value("kty"), crv: value("crv"), x: value("x"), y: value("y"),
            ext: true, key_ops: ["verify"]
          };
          if (!publicJwk.kty || !publicJwk.crv || !publicJwk.x || !publicJwk.y) {
            throw new Error("APK-pinned OTA public key was not found or is incomplete");
          }
          const publicKey = await webcrypto.subtle.importKey(
            "jwk", publicJwk, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]
          );
          const digestHex = async value => Buffer.from(
            await webcrypto.subtle.digest("SHA-256", new TextEncoder().encode(value))
          ).toString("hex");

          for (const app of ["admin", "patrol", "subscriber"]) {
            const url = "https://pooyeshzamin-api.pooyesh-zamin.workers.dev/api/android/ota?name=" + app;
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              const detail = (await response.text()).slice(0, 1000);
              throw new Error("Live Worker returned HTTP " + response.status + " for " + app + ": " + detail);
            }
            if (!(response.headers.get("content-type") || "").includes("application/json")) {
              throw new Error("Live Worker returned a non-JSON response for " + app);
            }
            const envelope = await response.json();
            if (typeof envelope.payload !== "string" || typeof envelope.signature !== "string") {
              throw new Error("Malformed OTA signature envelope for " + app);
            }
            const etag = (response.headers.get("etag") || "").replaceAll('"', "").toLowerCase();
            if (!etag || etag !== await digestHex(envelope.payload)) {
              throw new Error("Live OTA ETag/payload digest mismatch for " + app);
            }
            const payloadBytes = new TextEncoder().encode(envelope.payload);
            const signature = Buffer.from(envelope.signature, "base64url");
            if (signature.length !== 64) throw new Error("Invalid P-256 signature length for " + app);
            const valid = await webcrypto.subtle.verify(
              { name: "ECDSA", hash: "SHA-256" }, publicKey, signature, payloadBytes
            );
            if (!valid) throw new Error("Live Worker signature does not match APK public key for " + app);

            const signed = JSON.parse(envelope.payload);
            if (signed.schema !== 1 || signed.app !== app || typeof signed.build !== "string" ||
                typeof signed.html !== "string" || !signed.hashes || !signed.hashes.files ||
                !signed.files || typeof signed.files !== "object") {
              throw new Error("Invalid signed OTA manifest for " + app);
            }
            const expected = app === "subscriber"
              ? ["assets/a.jpg", "assets/b.jpg", "pz-experience-v160.js", "shared/offline-sync.js"]
              : ["pz-experience-v160.js", "shared/offline-sync.js"];
            if (Object.keys(signed.files).sort().join("\n") !== expected.join("\n")) {
              throw new Error("Unexpected OTA file set for " + app);
            }
            if (signed.hashes.html !== await digestHex(signed.html)) {
              throw new Error("Signed HTML digest mismatch for " + app);
            }
            const buildTag = signed.html.match(/<meta[^>]*name=["']pz-build["'][^>]*>/i)?.[0] || "";
            if (!buildTag.includes(signed.build)) throw new Error("HTML/build metadata mismatch for " + app);
            for (const [name, content] of Object.entries(signed.files)) {
              if (typeof content !== "string" || signed.hashes.files[name] !== await digestHex(content)) {
                throw new Error("Signed file digest mismatch: " + app + "/" + name);
              }
            }
            const tampered = await webcrypto.subtle.verify(
              { name: "ECDSA", hash: "SHA-256" }, publicKey, signature,
              new TextEncoder().encode(envelope.payload + " ")
            );
            if (tampered) throw new Error("Tampered payload was accepted for " + app);
            console.log("Verified live OTA key pair, signature, manifest and hashes: " + app + " build " + signed.build);
          }
          NODE

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-validation-${{ steps.source.outputs.sha || 'unknown' }}
          path: |
            validation.log
            source-revision.txt
            live-ota-validation.log
          if-no-files-found: warn
