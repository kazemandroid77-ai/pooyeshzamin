name: Validate patrol UI stability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-patrol-ui-stability.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit in ModernOutlook/pooyeshzamin"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical Pooyesh Zamin source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ inputs.source_ref || 'main' }}
          path: source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run complete regression suite
        working-directory: source
        run: npm test

      - name: Validate application HTML and embedded JavaScript
        working-directory: source
        run: node scripts/validate-apps.mjs

      - name: Verify patrol UI stability and HTML whitespace
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('apps/patrol/index.html', 'utf8');
          const literalNewline = String.fromCharCode(92) + 'n';
          if (html.includes('</style>' + literalNewline + '<style id="pz-patrol-gps-switch">')) {
            throw new Error('Literal backslash-n remains between patrol style blocks');
          }
          if (html.includes('</style>' + literalNewline + '</head>')) {
            throw new Error('Literal backslash-n remains before the document head closes');
          }
          if (!html.includes('function shell(tabs,preserve=false)')) {
            throw new Error('Preserving shell render mode is missing');
          }
          if (!html.includes('view.innerHTML!==nextView')) {
            throw new Error('No-op view render guard is missing');
          }
          if (!html.includes('patrolMissionRefreshInFlight')) {
            throw new Error('Single-flight patrol mission polling guard is missing');
          }
          const timerStart = html.indexOf('patrolMissionTimer=setInterval');
          const timerEnd = html.indexOf('\n};', timerStart);
          const timer = timerStart >= 0 && timerEnd > timerStart ? html.slice(timerStart, timerEnd) : '';
          if (!timer.includes('render(true)') || timer.includes('.then(render)')) {
            throw new Error('Mission polling must preserve the current UI and never force a full render');
          }
          if (!timer.includes('document.activeElement')) {
            throw new Error('Mission polling must pause while a user is editing a control');
          }
          const otaBuild = html.match(/name="pz-build" content="([0-9]+)"/i);
          if (!otaBuild || Number(otaBuild[1]) <= 202611271200) {
            throw new Error('Patrol OTA build marker must advance for existing 1.8.0 installs');
          }
          console.log('Patrol stable-render, single-flight polling, OTA version and stray-text guards passed.');
          NODE
