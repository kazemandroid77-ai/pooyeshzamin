name: Validate internal-admin approval flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-internal-admin.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit in ModernOutlook/pooyeshzamin"
        required: false
        default: "feature/internal-admin-request-approval"
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical private source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ inputs.source_ref || 'feature/internal-admin-request-approval' }}
          path: source
          fetch-depth: 0

      - name: Record source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated ModernOutlook/pooyeshzamin@$sha"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run complete Node regression suite
        working-directory: source
        run: npm test

      - name: Validate application invariants
        working-directory: source
        run: node scripts/validate-apps.mjs

      - name: Check Worker and processor syntax
        working-directory: source
        run: |
          set -euo pipefail
          node --check cloudflare/worker.js
          node --check cloudflare/processor.js

      - name: Upload source revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-admin-validation-${{ steps.source.outputs.sha || 'checkout-failed' }}
          path: source/.git/HEAD
          if-no-files-found: ignore
          retention-days: 30
