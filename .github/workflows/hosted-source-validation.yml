name: Hosted source validation

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/hosted-source-validation.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit in ModernOutlook/pooyeshzamin"
        required: false
        default: "main"
        type: string
      source_sha:
        description: "Optional exact 40-character source commit SHA"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical private source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ inputs.source_sha || inputs.source_ref || 'feat/insight-novin-html-guide-migration' }}
          path: source
          fetch-depth: 0

      - name: Verify source revision and token access
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_REF: ${{ inputs.source_ref || 'feat/insight-novin-html-guide-migration' }}
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          if [[ -n "$REQUESTED_SHA" ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "source_sha must be a 40-character commit SHA." >&2
              exit 1
            }
            [[ "$actual" == "$REQUESTED_SHA" ]] || {
              echo "Checked-out source SHA does not match requested source_sha." >&2
              exit 1
            }
          fi
          {
            echo "source_repository=ModernOutlook/pooyeshzamin"
            echo "source_ref=${REQUESTED_REF:-main}"
            echo "source_sha=$actual"
            echo "host_repository=kazemandroid77-ai/pooyeshzamin"
            echo "host_run_id=$GITHUB_RUN_ID"
          } | tee source-revision.txt
          echo "sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete Node regression suite
        working-directory: source
        run: npm test

      - name: Run application, OTA and release invariant checks
        working-directory: source
        run: node scripts/validate-apps.mjs

      - name: Check backend and D1 module syntax
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            cloudflare/worker.js \
            cloudflare/processor.js \
            cloudflare/partitioned-store.js \
            cloudflare/partitioning.js \
            cloudflare/realtime.js \
            cloudflare/d1-store.js; do
            node --check "$file"
            echo "Syntax OK: $file"
          done

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-validation-${{ steps.source.outputs.sha || 'checkout-failed' }}
          path: source-revision.txt
          if-no-files-found: warn
          retention-days: 30
