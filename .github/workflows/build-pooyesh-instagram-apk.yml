name: Build standalone Pooyesh Zamin Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/instagram-template-standalone-apk
    paths:
      - 'instagram-template-android/**'
      - '.github/workflows/build-pooyesh-instagram-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable standalone APK
        working-directory: instagram-template-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pooyesh-zamin-instagram-standalone-apk
          path: instagram-template-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
