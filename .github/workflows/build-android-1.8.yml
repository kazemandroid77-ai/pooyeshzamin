name: Build PooyeshZamin Android 1.8.2
run-name: Build PooyeshZamin Android ${{ inputs.version }} from canonical source

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android release version (MAJOR.MINOR.PATCH)"
        required: true
        default: "1.8.2"
        type: string
      source_sha:
        description: "Exact merged commit SHA from ModernOutlook/pooyeshzamin main"
        required: true
        default: "dafd034a43977ac13bc00f7efcaee15a958bfc6a"
        type: string

permissions:
  contents: read

concurrency:
  group: pooyeshzamin-android-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and verify three Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate source SHA format
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be an exact 40-character commit SHA." >&2
            exit 1
          }

      - name: Checkout canonical source at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 0

      - name: Verify source is merged into canonical main
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$SOURCE_SHA" ]] || {
            echo "Checked out source SHA does not match requested SHA." >&2
            exit 1
          }
          git -C source fetch origin main --no-tags
          git -C source merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD || {
            echo "Only commits already merged into ModernOutlook/pooyeshzamin main may be built." >&2
            exit 1
          }
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Canonical source: ModernOutlook/pooyeshzamin@$ACTUAL_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: pooyesh-android-1.8.2-${{ runner.os }}-${{ hashFiles('source/scripts/release/build-android.sh', 'source/scripts/android-location-bridge.js') }}
          restore-keys: |
            pooyesh-android-1.8.2-${{ runner.os }}-

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || {
            echo "Android sdkmanager not found under $SDK_ROOT." >&2
            exit 1
          }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip

      - name: Validate source code and permission bridge
        working-directory: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(python3 scripts/release/version-code.py "$VERSION")"
          [[ "$VERSION_CODE" == "1008002" && "$VERSION" == "1.8.2" ]] || {
            echo "This workflow is reserved for Android 1.8.2 (versionCode 1008002)." >&2
            exit 1
          }
          node scripts/validate-apps.mjs
          bash -n scripts/release/build-android.sh
          node --check scripts/android-location-bridge.js
          node --check scripts/android/pz-experience-v160.js
          node --check apps/shared/android-ota.js
          node --check apps/shared/android-update-manager.js
          echo "version_code=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore release signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || {
            echo "Missing APK_KEYSTORE_BASE64 secret in kazemandroid77-ai/pooyeshzamin." >&2
            exit 1
          }
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"
          test -s "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"

      - name: Build admin, patrol and subscriber APKs
        working-directory: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PZ_STORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          PZ_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          PZ_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          PZ_ENABLE_FCM: "0"
        run: |
          set -euo pipefail
          for name in PZ_STORE_PASSWORD PZ_KEY_ALIAS PZ_KEY_PASSWORD; do
            test -n "${!name}" || {
              echo "Missing signing secret: $name" >&2
              exit 1
            }
          done
          bash scripts/release/build-android.sh "$PWD" "$VERSION" "$GITHUB_WORKSPACE/android-output" "$RUNNER_TEMP/signing/pooyeshzamin-release.jks"

      - name: Verify APK metadata, signing and Android permissions
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$SIGNER"
          test "$(find android-output -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3

          for app in admin patrol subscriber; do
            apk="android-output/pooyesh-$app-$VERSION.apk"
            test -s "$apk"
            badging="$("$AAPT" dump badging "$apk")"
            grep -Fq "name='com.modernoutlook.pooyeshzamin.$app'" <<< "$badging"
            grep -Fq "versionCode='1008002'" <<< "$badging"
            grep -Fq "versionName='$VERSION'" <<< "$badging"

            permissions="$("$AAPT" dump permissions "$apk")"
            for permission in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION CAMERA POST_NOTIFICATIONS; do
              grep -Fq "android.permission.$permission" <<< "$permissions" || {
                echo "$app APK is missing android.permission.$permission" >&2
                exit 1
              }
            done

            if [[ "$app" == "patrol" ]]; then
              grep -Fq android.permission.FOREGROUND_SERVICE <<< "$permissions"
              grep -Fq android.permission.FOREGROUND_SERVICE_LOCATION <<< "$permissions"
            fi

            verify="$("$SIGNER" verify --print-certs "$apk" 2>&1)"
            cert="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' <<< "$verify" | head -n 1 | tr '[:lower:]' '[:upper:]')"
            [[ "$cert" == "86F196E7E3445F064E71A58E3C9260053C1415A4A31B3EFF38448E385E2B5FFE" ]] || {
              echo "Unexpected release signing certificate for $app: $cert" >&2
              exit 1
            }

            unzip -p "$apk" assets/public/android-location-bridge.js > "$RUNNER_TEMP/$app-permissions-bridge.js"
            grep -Fq PZAndroidPermissions "$RUNNER_TEMP/$app-permissions-bridge.js"
            unzip -p "$apk" assets/public/shared/android-update-manager.js > "$RUNNER_TEMP/$app-update-manager.js"
            grep -Fq "checkAll" "$RUNNER_TEMP/$app-update-manager.js"
            grep -Fq "/api/releases/latest" "$RUNNER_TEMP/$app-update-manager.js"
            grep -Fq 'name="pz-app-version"' <(unzip -p "$apk" assets/public/index.html) || { echo "$app APK is missing pz-app-version HTML metadata" >&2; exit 1; }
            grep -Fq 'name="pz-version-code"' <(unzip -p "$apk" assets/public/index.html) || { echo "$app APK is missing pz-version-code HTML metadata" >&2; exit 1; }
            grep -Fq pickPhoto "$RUNNER_TEMP/$app-permissions-bridge.js"
            grep -Fq requestNotifications "$RUNNER_TEMP/$app-permissions-bridge.js"
            echo "PASS: $app metadata, release signature and permission declarations."
          done

      - name: Prepare versioned Android bundle and checksums
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION_CODE: "1008002"
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp android-output/pooyesh-*-"$VERSION".apk bundle/
          cat > bundle/BUILD_INFO.txt <<EOF
          versionName=$VERSION
          versionCode=$VERSION_CODE
          sourceRepository=ModernOutlook/pooyeshzamin
          sourceCommit=$SOURCE_SHA
          workflowRepository=kazemandroid77-ai/pooyeshzamin
          workflowRunId=$GITHUB_RUN_ID
          androidApps=admin,patrol,subscriber
          permissions=coarse-location,fine-location,camera,photo-picker,notifications
          EOF
          (
            cd bundle
            sha256sum *.apk BUILD_INFO.txt > SHA256SUMS.txt
          )
          test "$(find bundle -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3

      - name: Upload three Android installers
        uses: actions/upload-artifact@v4
        with:
          name: PooyeshZamin-Android-${{ inputs.version }}
          path: bundle/*
          if-no-files-found: error
          retention-days: 14
