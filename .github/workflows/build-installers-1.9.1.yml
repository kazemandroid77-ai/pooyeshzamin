name: Build Pooyesh Zamin 1.9.1 installers
run-name: Build Pooyesh Zamin ${{ inputs.version || '1.9.1' }} installers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-installers-1.9.1.yml
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        default: 1.9.1
        type: string
      source_sha:
        description: Exact commit in ModernOutlook/pooyeshzamin main
        required: true
        default: 9087ba111fe22362ee815a844537c84ef862e97a
        type: string

permissions:
  contents: read

concurrency:
  group: pooyeshzamin-installers-${{ inputs.version || '1.9.1' }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version || '1.9.1' }}
  SOURCE_SHA: ${{ inputs.source_sha || '9087ba111fe22362ee815a844537c84ef862e97a' }}

jobs:
  validate:
    name: Validate source, version and release invariants
    runs-on: ubuntu-24.04
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Validate requested source SHA and version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Version must be strict MAJOR.MINOR.PATCH" >&2; exit 1;
          }

      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: true
          path: source
          fetch-depth: 0

      - name: Verify source is merged into canonical main
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests and full app validation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node scripts/validate-apps.mjs
          node --check scripts/android/pz-experience-v160.js
          node --check scripts/android-location-bridge.js
          node --check apps/shared/android-ota.js
          node --check apps/shared/android-update-manager.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          bash -n scripts/release/build-android.sh

      - name: Calculate canonical Android versionCode
        id: version
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          code="$(python scripts/release/version-code.py "$RELEASE_VERSION")"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_VERSION maps to Android versionCode $code"

  android:
    name: Build and verify three signed Android APKs
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: true
          path: source

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$manager")" >> "$GITHUB_PATH"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install image and archive utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip

      - name: Restore permanent Android release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing APK_KEYSTORE_BASE64" >&2; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/pooyesh-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/pooyesh-release.jks"
          test -s "$RUNNER_TEMP/signing/pooyesh-release.jks"

      - name: Build all Android panels
        working-directory: source
        shell: bash
        env:
          PZ_STORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          PZ_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          PZ_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PZ_STORE_PASSWORD PZ_KEY_ALIAS PZ_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing secret: $name" >&2; exit 1; }
          done
          bash scripts/release/build-android.sh "$GITHUB_WORKSPACE/source" "$RELEASE_VERSION" "$GITHUB_WORKSPACE/android-output" "$RUNNER_TEMP/signing/pooyesh-release.jks"

      - name: Verify package IDs, version metadata, signature and OTA assets
        shell: bash
        env:
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt" && test -x "$signer"
          test "$(find android-output -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3
          for app in admin patrol subscriber; do
            apk="android-output/pooyesh-$app-$RELEASE_VERSION.apk"
            test -s "$apk"
            badging="$("$aapt" dump badging "$apk")"
            grep -Fq "name='com.modernoutlook.pooyeshzamin.$app'" <<< "$badging"
            grep -Fq "versionCode='$VERSION_CODE'" <<< "$badging"
            grep -Fq "versionName='$RELEASE_VERSION'" <<< "$badging"
            cert="$("$signer" verify --print-certs "$apk" 2>&1 | sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]+).*/\1/p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
            test "$cert" = "86F196E7E3445F064E71A58E3C9260053C1415A4A31B3EFF38448E385E2B5FFE" || {
              echo "Unexpected release certificate for $app: $cert" >&2; exit 1;
            }
            unzip -p "$apk" assets/public/shared/android-ota.js | grep -Fq "checkForUpdates"
            unzip -p "$apk" assets/public/shared/android-update-manager.js | grep -Fq "/api/releases/latest"
            echo "PASS: $app $RELEASE_VERSION ($VERSION_CODE), release certificate and OTA bootstrap"
          done

      - name: Upload Android installers
        uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: android-output/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows x64 management installer
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: true
          path: source

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version and build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python source/scripts/release/version-code.py $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release version' }
          Push-Location source/desktop
          try {
            npm version $env:RELEASE_VERSION --no-git-tag-version
            if ($LASTEXITCODE -ne 0) { throw 'npm version failed' }
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run build:icon
            if ($LASTEXITCODE -ne 0) { throw 'Windows icon build failed' }
            npm run dist:win
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          } finally {
            Pop-Location
          }
          $out = Join-Path $PWD 'windows-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem source/desktop/dist -File | Copy-Item -Destination $out -Force
          $installer = Join-Path $out "PooyeshZamin-Admin-Setup-$($env:RELEASE_VERSION).exe"
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -le 0) { throw "Missing Windows installer: $installer" }
          if (-not (Test-Path "$installer.blockmap") -or -not (Test-Path (Join-Path $out 'latest.yml'))) { throw 'Missing Windows updater metadata' }

      - name: Upload Windows installer and updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows-output/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Assemble and checksum verified installers
    needs: [validate, android, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-installers
          path: bundle

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: bundle

      - name: Validate four installers and create checksums
        shell: bash
        env:
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd bundle
          for file in "pooyesh-admin-$RELEASE_VERSION.apk" "pooyesh-patrol-$RELEASE_VERSION.apk" "pooyesh-subscriber-$RELEASE_VERSION.apk" "PooyeshZamin-Admin-Setup-$RELEASE_VERSION.exe"; do
            test -s "$file" || { echo "Missing installer: $file" >&2; exit 1; }
          done
          test -s "PooyeshZamin-Admin-Setup-$RELEASE_VERSION.exe.blockmap"
          test -s latest.yml
          test "$(find . -maxdepth 1 -name '*.apk' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          grep -Fq "version: $RELEASE_VERSION" latest.yml
          cat > BUILD_INFO.txt <<EOF
          versionName=$RELEASE_VERSION
          versionCode=$VERSION_CODE
          sourceRepository=ModernOutlook/pooyeshzamin
          sourceCommit=$SOURCE_SHA
          workflowRepository=kazemandroid77-ai/pooyeshzamin
          workflowRunId=$WORKFLOW_RUN_ID
          EOF
          sha256sum *.apk *.exe latest.yml *.blockmap BUILD_INFO.txt > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          ## پویش زمین $RELEASE_VERSION

          - APK پنل مدیریت
          - APK پنل نیروهای گشتی
          - APK پنل مشترکین
          - نصب‌کننده Windows x64 پنل مدیریت و حسابرسی

          فایل‌های رابط کاربری و منابع ثابت داخل نصب‌کننده‌ها بسته‌بندی شده‌اند. مسیر OTA موجود حفظ شده و فعال‌سازی به‌روزرسانی فقط از طریق کنترل کاربر انجام می‌شود.
          برای بررسی یکپارچگی فایل‌ها از SHA256SUMS.txt استفاده کنید.
          EOF

      - name: Upload complete versioned installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: PooyeshZamin-${{ env.RELEASE_VERSION }}-Installers
          path: bundle/*
          if-no-files-found: error
          retention-days: 14
