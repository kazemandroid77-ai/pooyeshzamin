name: Convert 55 PNG cards to print-ready PSD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/png-to-print-psd.yml"
      - "scripts/png-to-print-psd.py"

permissions:
  contents: read

concurrency:
  group: png-to-print-psd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    name: Build and validate 55 independent PSD files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install conversion libraries
        run: python -m pip install --upgrade pip pillow==11.3.0 psd-tools==1.27.0

      - name: Convert PNG files to layered PSD
        run: python scripts/png-to-print-psd.py

      - name: Package PSD deliverables
        run: |
          cd dist
          zip -r ../pooyeshzamin-55-print-psd.zip psd

      - name: Upload PSD package
        uses: actions/upload-artifact@v4
        with:
          name: pooyeshzamin-55-print-psd
          path: pooyeshzamin-55-print-psd.zip
          if-no-files-found: error
          retention-days: 30
