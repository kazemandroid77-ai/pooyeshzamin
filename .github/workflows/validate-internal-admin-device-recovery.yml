name: Validate internal-admin device recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-internal-admin-device-recovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical Pooyesh Zamin source
        uses: actions/checkout@v4
        with:
          repository: ModernOutlook/pooyeshzamin
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: feature/internal-admin-device-recovery
          path: source
          fetch-depth: 0

      - name: Record source revision
        working-directory: source
        run: |
          echo "Validating ModernOutlook/pooyeshzamin@$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete regression suite
        working-directory: source
        run: npm test

      - name: Validate application HTML and embedded JavaScript
        working-directory: source
        run: node scripts/validate-apps.mjs

      - name: Check Worker, processor, and partitioning syntax
        working-directory: source
        run: |
          node --check cloudflare/worker.js
          node --check cloudflare/processor.js
          node --check cloudflare/partitioning.js
