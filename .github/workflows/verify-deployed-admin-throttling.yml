name: Verify deployed internal-admin throttling

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-deployed-admin-throttling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployed Worker health and failed-code throttling
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://pooyeshzamin-api.pooyesh-zamin.workers.dev";
          const health = await fetch(base + "/health");
          if (!health.ok || !(await health.json()).ok) throw new Error("Production Worker health check failed.");

          const requestBody = {
            name: "Deployment Smoke Test",
            phone: "09123456780",
            code: "intentionally-invalid",
            pub: { kty: "EC", crv: "P-256", x: "invalid", y: "invalid" }
          };
          for (let attempt = 1; attempt <= 6; attempt++) {
            const response = await fetch(base + "/api/admin/request", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            const expected = attempt === 6 ? 429 : 403;
            if (response.status !== expected) {
              throw new Error("Attempt " + attempt + " expected HTTP " + expected +
                " but received " + response.status + ": " + JSON.stringify(data));
            }
            console.log("Attempt " + attempt + ": HTTP " + response.status);
          }
          console.log("Production rate limiting verified.");
          NODE
